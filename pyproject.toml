[project]
name = "symlmm"
version = "0.5.0"
description = "Symbolic moments for linear mixed, marginal, and GEE models"
readme = "README.md"
authors = [
    { name = "Heiner Atze", email = "heiner.atze@gmx.net" }
]
requires-python = ">=3.14"
dependencies = [
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs", "PLAN.md"]

[tool.mypy]
python_version = "3.14"
strict = true
